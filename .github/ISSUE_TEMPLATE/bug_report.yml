name: 问题反馈
description: 提交可复现的 Dragonfly 问题
title: '[Bug] '
body:
  - type: input
    id: dragonfly-version
    attributes:
      label: Dragonfly 版本或提交
      description: 查看主题 package.json 或运行 git rev-parse HEAD。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Node.js、Hexo、浏览器与操作系统版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
      description: 提供相关配置、操作步骤及错误日志，提交前移除密钥和私有内容。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 站点插件与自定义修改
      description: 可附上 npm ls --depth 0 的输出。
  - type: input
    id: reproduction
    attributes:
      label: 复现链接或示例仓库
